[package]
name = "dsearch"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fast local similarity search over decompilation-project functions"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
half = "2"
regex = "1.13.1"
blake2 = "0.10.6"
bytemuck = { version = "1.25.2", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "dsearch"
path = "src/main.rs"
